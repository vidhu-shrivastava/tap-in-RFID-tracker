<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tap-In — Card Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-xl px-5 py-12 sm:px-8 sm:py-16">
      <a class="text-sm font-semibold text-teal-800 underline decoration-teal-300 underline-offset-4" href="index.html">Back home</a>
      <section class="mt-8 border-t-4 border-teal-700 bg-white p-6 shadow-sm sm:p-8">
        <p class="text-sm font-semibold uppercase tracking-wide text-teal-800">Tap-In Member Setup</p>
        <h1 class="mt-2 text-3xl font-bold tracking-tight">Register an RFID card</h1>
        <p class="mt-3 text-slate-600">Enter the member details and the hexadecimal UID printed by your card reader.</p>

        <form id="registration-form" class="mt-8 space-y-5">
          <div>
            <label class="block text-sm font-semibold" for="full_name">Full name</label>
            <input
              id="full_name"
              name="full_name"
              type="text"
              autocomplete="name"
              maxlength="120"
              required
              class="mt-2 w-full rounded border border-slate-300 px-3 py-2.5 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/20"
              placeholder="Jane Doe"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold" for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              maxlength="254"
              required
              class="mt-2 w-full rounded border border-slate-300 px-3 py-2.5 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/20"
              placeholder="jane@school.edu"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold" for="rfid_uid">RFID hex string</label>
            <input
              id="rfid_uid"
              name="rfid_uid"
              type="text"
              autocapitalize="characters"
              spellcheck="false"
              pattern="[A-Fa-f0-9]+"
              title="Enter the card UID using hexadecimal characters (0-9 and A-F)."
              required
              class="mt-2 w-full rounded border border-slate-300 px-3 py-2.5 font-mono uppercase focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/20"
              placeholder="A1B2C3D4"
            />
          </div>

          <button
            type="submit"
            class="w-full rounded bg-teal-800 px-4 py-3 font-semibold text-white transition hover:bg-teal-900 focus:outline-none focus:ring-2 focus:ring-teal-700 focus:ring-offset-2 sm:w-auto"
          >
            Submit registration
          </button>
        </form>

        <!-- Week 1 is a static form: this message confirms the demo only, not a database write. -->
        <p id="form-status" class="mt-5 min-h-6 text-sm text-slate-700" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script>
      const registrationForm = document.querySelector("#registration-form");
      const formStatus = document.querySelector("#form-status");

      // Keep Week 1 static: validate in the browser, but do not claim to save data.
      registrationForm.addEventListener("submit", (event) => {
        event.preventDefault();
        formStatus.textContent = "Form check passed. No member was saved; database registration will be connected later.";
      });
    </script>
  </body>
</html>
