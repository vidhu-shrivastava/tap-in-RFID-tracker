<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tap-In — Card Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <!-- Owner branch: branch-db-onboarding — placeholder so Git tracks this file -->
    <main class="mx-auto max-w-lg px-6 py-16">
      <h1 class="text-3xl font-bold tracking-tight">Register Card</h1>
      <p class="mt-2 text-slate-600">
        Placeholder — form to link full name, email, and RFID UID to
        <code class="text-xs">members</code>.
      </p>
      <form class="mt-8 space-y-4" onsubmit="event.preventDefault();">
        <label class="block text-sm">
          Full name
          <input
            type="text"
            name="full_name"
            class="mt-1 w-full rounded border border-slate-300 px-3 py-2"
            placeholder="Jane Doe"
            disabled
          />
        </label>
        <label class="block text-sm">
          Email
          <input
            type="email"
            name="email"
            class="mt-1 w-full rounded border border-slate-300 px-3 py-2"
            placeholder="jane@school.edu"
            disabled
          />
        </label>
        <label class="block text-sm">
          RFID UID
          <input
            type="text"
            name="rfid_uid"
            class="mt-1 w-full rounded border border-slate-300 px-3 py-2"
            placeholder="A1B2C3D4"
            disabled
          />
        </label>
        <button
          type="submit"
          class="rounded bg-slate-800 px-4 py-2 text-sm text-white opacity-50"
          disabled
        >
          Submit (wire up on your branch)
        </button>
      </form>
      <p class="mt-6 text-sm">
        <a class="text-sky-700 underline" href="index.html">← Back home</a>
      </p>
    </main>
  </body>
</html>
