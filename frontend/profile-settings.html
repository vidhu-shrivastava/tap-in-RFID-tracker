<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Update your Tap-IN member profile settings."
    />
    <title>Profile Settings | Tap-IN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };

      try {
        if (localStorage.getItem("tapInTheme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {
        console.error("Could not load the display theme preference.", error);
      }
    </script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-green-100 via-emerald-50 to-teal-100 text-slate-900 dark:bg-slate-950 dark:bg-none dark:text-slate-100">
    <!-- Keep the settings page navigation simple and easy to leave. -->
    <header class="border-b border-emerald-200 bg-white/90 shadow-sm shadow-emerald-950/10 dark:border-emerald-800 dark:bg-slate-900 dark:shadow-[0_1px_14px_rgba(16,185,129,0.12)]">
      <nav
        aria-label="Main navigation"
        class="mx-auto flex max-w-3xl items-center justify-between px-4 py-4 sm:px-6"
      >
        <a
          href="dashboard.html"
          class="flex items-center gap-2 text-lg font-bold tracking-tight text-emerald-900 dark:text-teal-300"
        >
          <svg aria-hidden="true" class="h-8 w-8 text-emerald-700 dark:text-emerald-400" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="40" height="40" rx="12" stroke="currentColor" stroke-width="2.5" />
            <path d="M13 16h18M22 16v19" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <path d="M31 21c2.5 2 2.5 6 0 8M35 17c5 4 5 12 0 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
          </svg>
          <span>Tap-IN</span>
        </a>
        <a
          href="dashboard.html"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-teal-700 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
        >
          Back to dashboard
        </a>
      </nav>
    </header>

    <!-- The form only saves profile changes when Save and Exit is pressed. -->
    <main class="mx-auto max-w-3xl px-4 py-8 sm:px-6 sm:py-12">
      <section
        aria-labelledby="settings-heading"
        class="rounded-2xl border border-emerald-200 bg-white p-6 shadow-lg shadow-emerald-950/10 dark:border-emerald-800 dark:bg-slate-900 dark:ring-1 dark:ring-emerald-500/30 dark:shadow-[0_0_22px_rgba(16,185,129,0.12)] sm:p-8"
      >
        <div class="mb-8">
          <p           class="text-sm font-semibold uppercase tracking-wider text-emerald-800 dark:text-emerald-300">
            Account
          </p>
          <h1
            id="settings-heading"
            class="mt-2 text-2xl font-bold tracking-tight sm:text-3xl"
          >
            Profile settings
          </h1>
          <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">
            Update your profile picture and preferred name. Your account name cannot be changed.
          </p>
        </div>

        <form id="profile-form" class="space-y-6">
          <div class="flex items-center gap-4">
            <div
              class="flex h-16 w-16 shrink-0 items-center justify-center overflow-hidden rounded-full bg-gradient-to-br from-green-100 via-emerald-100 to-teal-100 text-lg font-bold text-emerald-900 ring-4 ring-emerald-50 shadow-sm shadow-emerald-900/10 dark:from-emerald-950 dark:via-teal-900 dark:to-cyan-900 dark:text-emerald-200 dark:ring-emerald-500/60 dark:shadow-[0_0_16px_rgba(16,185,129,0.18)]"
            >
              <span id="avatar-initials">AM</span>
              <img
                id="avatar-preview"
                class="hidden h-full w-full object-cover"
                alt="Profile picture preview"
              />
            </div>
            <div>
              <label
                for="profile-picture"
                class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300"
              >
                Profile picture
              </label>
              <input
                id="profile-picture"
                name="profile-picture"
                type="file"
                accept="image/*"
                class="block w-full text-sm text-slate-700 file:mr-3 file:rounded-lg file:border-0 file:bg-slate-100 file:px-3 file:py-2 file:font-medium hover:file:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-700 dark:text-slate-300 dark:file:bg-slate-800 dark:file:text-slate-100 dark:hover:file:bg-slate-700"
              />
              <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">
                Image files up to 2 MB are supported.
              </p>
            </div>
          </div>

          <div class="grid gap-5 sm:grid-cols-2">
            <div>
              <span class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">
                Account name
              </span>
              <p
                id="account-name"
                class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300"
                aria-live="polite"
              >
                Alex Member
              </p>
              <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">
                Account names are managed by your administrator.
              </p>
            </div>
            <div>
              <label
                for="preferred-name"
                class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300"
              >
                Preferred name
              </label>
              <input
                id="preferred-name"
                name="preferred-name"
                type="text"
                autocomplete="nickname"
                class="block w-full rounded-lg border border-emerald-200 bg-white px-4 py-3 text-sm text-slate-900 outline-none focus:border-emerald-700 focus:ring-2 focus:ring-emerald-700/20 dark:border-emerald-800 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-emerald-400 dark:focus:ring-emerald-400/30"
              />
            </div>
          </div>

          <p
            id="profile-status"
            class="text-sm text-rose-700 dark:text-rose-300"
            role="status"
            aria-live="polite"
          ></p>

          <!-- Both exit choices stay together at the bottom of the form. -->
          <div class="flex flex-col-reverse gap-3 border-t border-emerald-100 pt-6 sm:flex-row sm:justify-end dark:border-emerald-900">
            <button
              id="exit-without-saving"
              type="button"
              class="rounded-lg border border-slate-300 px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-700 dark:border-emerald-700 dark:text-slate-200 dark:hover:border-emerald-500 dark:hover:bg-emerald-950/50"
            >
              Exit without Saving
            </button>
            <button
              type="submit"
              class="rounded-lg bg-gradient-to-r from-green-700 via-emerald-700 to-teal-700 px-5 py-3 text-sm font-semibold text-white shadow-md shadow-emerald-900/20 hover:from-green-800 hover:via-emerald-800 hover:to-teal-800 focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:ring-offset-2 dark:focus:ring-offset-slate-900"
            >
              Save and Exit
            </button>
          </div>
        </form>
      </section>
    </main>

    <!-- Vanilla JavaScript previews images and saves edits only on confirmation. -->
    <script>
      const profileForm = document.getElementById("profile-form");
      const profilePictureInput = document.getElementById("profile-picture");
      const accountNameDisplay = document.getElementById("account-name");
      const preferredNameInput = document.getElementById("preferred-name");
      const avatarInitials = document.getElementById("avatar-initials");
      const avatarPreview = document.getElementById("avatar-preview");
      const profileStatus = document.getElementById("profile-status");
      let accountName = "Alex Member";
      let selectedPicture = "";
      let imageIsReading = false;

      function setAvatar(picture, name) {
        const initials = name
          .split(/\s+/)
          .slice(0, 2)
          .map((part) => part.charAt(0).toUpperCase())
          .join("");
        avatarInitials.textContent = initials || "AM";

        if (picture && picture.startsWith("data:image/")) {
          avatarPreview.src = picture;
          avatarPreview.classList.remove("hidden");
          avatarInitials.classList.add("hidden");
        } else {
          avatarPreview.removeAttribute("src");
          avatarPreview.classList.add("hidden");
          avatarInitials.classList.remove("hidden");
        }
      }

      try {
        const savedProfile = localStorage.getItem("tapInMemberProfile");
        if (savedProfile) {
          const profile = JSON.parse(savedProfile);
          if (!profile || typeof profile !== "object") {
            throw new Error("Saved profile data is not an object.");
          }
          accountName =
            typeof profile.name === "string" && profile.name.trim()
              ? profile.name.trim()
              : "Alex Member";
          accountNameDisplay.textContent = accountName;
          preferredNameInput.value = profile.preferredName || "";
          selectedPicture =
            typeof profile.picture === "string" &&
            profile.picture.startsWith("data:image/")
              ? profile.picture
              : "";
          setAvatar(selectedPicture, accountName);
        } else {
          accountNameDisplay.textContent = accountName;
          preferredNameInput.value = "Alex";
          setAvatar("", accountName);
        }
      } catch (error) {
        console.error("Could not load saved profile settings.", error);
        profileStatus.textContent =
          "Saved profile settings could not be loaded. You can still enter new values.";
        accountNameDisplay.textContent = accountName;
        preferredNameInput.value = "Alex";
        setAvatar("", accountName);
      }

      profilePictureInput.addEventListener("change", () => {
        const picture = profilePictureInput.files[0];
        profileStatus.textContent = "";

        if (!picture) {
          return;
        }

        if (!picture.type.startsWith("image/")) {
          profilePictureInput.value = "";
          profileStatus.textContent = "Choose a valid image file.";
          return;
        }

        if (picture.size > 2 * 1024 * 1024) {
          profilePictureInput.value = "";
          profileStatus.textContent = "Choose an image smaller than 2 MB.";
          return;
        }

        imageIsReading = true;
        const reader = new FileReader();
        reader.addEventListener("load", () => {
          imageIsReading = false;
          if (typeof reader.result === "string") {
            selectedPicture = reader.result;
            setAvatar(selectedPicture, accountName);
          } else {
            profileStatus.textContent = "The image could not be previewed.";
          }
        });
        reader.addEventListener("error", () => {
          imageIsReading = false;
          profileStatus.textContent = "The image could not be read. Try another file.";
        });
        reader.readAsDataURL(picture);
      });

      profileForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (imageIsReading) {
          profileStatus.textContent = "Wait for the profile picture to finish loading.";
          return;
        }

        const profile = {
          name: accountName,
          preferredName: preferredNameInput.value.trim(),
          picture: selectedPicture,
        };

        try {
          localStorage.setItem("tapInMemberProfile", JSON.stringify(profile));
          window.location.href = "dashboard.html";
        } catch (error) {
          console.error("Could not save profile settings.", error);
          profileStatus.textContent =
            "Your profile could not be saved in this browser. Try a smaller picture or another browser.";
        }
      });

      document
        .getElementById("exit-without-saving")
        .addEventListener("click", () => {
          window.location.href = "dashboard.html";
        });
    </script>
  </body>
</html>
