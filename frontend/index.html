<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in or create an account in Tap-In."
    />
    <title>Tap-In | Member Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };

      try {
        if (localStorage.getItem("tapInTheme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {
        console.error("Could not load the display theme preference.", error);
      }
    </script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-green-100 via-emerald-50 to-teal-100 text-slate-900 dark:bg-slate-950 dark:bg-none dark:text-slate-100">
    <header class="border-b border-emerald-200 bg-white/90 shadow-sm shadow-emerald-950/10 dark:border-emerald-800 dark:bg-slate-900 dark:shadow-[0_1px_14px_rgba(16,185,129,0.12)]">
      <nav aria-label="Main navigation" class="mx-auto flex max-w-xl items-center justify-between px-4 py-4 sm:px-6">
        <a href="index.html" class="flex items-center gap-2 text-lg font-bold tracking-tight text-emerald-900 dark:text-teal-300">
          <svg aria-hidden="true" class="h-8 w-8 text-emerald-700 dark:text-emerald-400" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="40" height="40" rx="12" stroke="currentColor" stroke-width="2.5" />
            <path d="M13 16h18M22 16v19" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <path d="M31 21c2.5 2 2.5 6 0 8M35 17c5 4 5 12 0 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
          </svg>
          <span>Tap-IN</span>
        </a>

        <button
          id="theme-toggle"
          type="button"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-emerald-50 hover:text-emerald-900 focus:outline-none focus:ring-2 focus:ring-emerald-700 dark:text-slate-300 dark:hover:bg-emerald-950/50 dark:hover:text-emerald-200"
        >
          Switch to dark mode
        </button>
      </nav>
    </header>

    <main class="flex min-h-screen items-center justify-center px-4 py-10">
      <section aria-labelledby="page-title" class="w-full max-w-md rounded-2xl border border-emerald-200 bg-white p-6 shadow-lg shadow-emerald-950/10 dark:border-emerald-800 dark:bg-slate-900 dark:ring-1 dark:ring-emerald-500/30 dark:shadow-[0_0_22px_rgba(16,185,129,0.12)] sm:p-9">
        <header class="mb-8 text-center">
          <p class="text-sm font-semibold uppercase tracking-wider text-emerald-800 dark:text-emerald-300">
            Member access
          </p>
          <h1 id="page-title" class="mt-2 text-2xl font-bold tracking-tight sm:text-3xl">
            Tap-In Attendance
          </h1>
          <p class="mt-3 text-sm text-slate-600 dark:text-slate-300">
            Create an account first. Your UGA OneCard is bound from the dashboard after you sign in.
          </p>
        </header>

        <div class="mb-6 grid grid-cols-2 gap-2 rounded-xl border border-emerald-100 bg-emerald-50 p-1 dark:border-emerald-800 dark:bg-slate-800/80">
          <button id="show-signin-tab" type="button" class="rounded-lg bg-white px-3 py-2 text-sm font-semibold text-emerald-900 shadow-sm dark:bg-slate-900 dark:text-emerald-200">
            Sign in
          </button>
          <button id="show-signup-tab" type="button" class="rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 hover:text-emerald-900 dark:text-slate-300 dark:hover:text-emerald-200">
            Create account
          </button>
        </div>

        <form id="sign-in-form" class="space-y-5">
          <div>
            <label for="signin-email" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">
              Email address
            </label>
            <input
              id="signin-email"
              name="signin-email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
              class="block w-full rounded-lg border border-emerald-200 bg-white px-4 py-3 text-base text-slate-900 outline-none placeholder:text-slate-400 focus:border-emerald-700 focus:ring-2 focus:ring-emerald-700/20 dark:border-emerald-800 dark:bg-slate-800 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-emerald-400 dark:focus:ring-emerald-400/30"
            />
          </div>

          <div>
            <label for="signin-password" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">
              Password
            </label>
            <input
              id="signin-password"
              name="signin-password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="Enter your password"
              class="block w-full rounded-lg border border-emerald-200 bg-white px-4 py-3 text-base text-slate-900 outline-none placeholder:text-slate-400 focus:border-emerald-700 focus:ring-2 focus:ring-emerald-700/20 dark:border-emerald-800 dark:bg-slate-800 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-emerald-400 dark:focus:ring-emerald-400/30"
            />
          </div>

          <button id="sign-in-button" type="submit" class="w-full rounded-lg bg-gradient-to-r from-green-700 via-emerald-700 to-teal-700 px-4 py-3 text-sm font-semibold text-white shadow-md shadow-emerald-900/20 transition hover:from-green-800 hover:via-emerald-800 hover:to-teal-800 focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60 dark:focus:ring-offset-slate-900">
            Sign in
          </button>
          <p id="sign-in-status" class="min-h-5 text-sm text-slate-600 dark:text-slate-300" role="status" aria-live="polite"></p>
        </form>

        <form id="sign-up-form" class="hidden space-y-5">
          <div>
            <label for="signup-name" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">
              Full name
            </label>
            <input
              id="signup-name"
              name="signup-name"
              type="text"
              autocomplete="name"
              required
              placeholder="Jane Doe"
              class="block w-full rounded-lg border border-emerald-200 bg-white px-4 py-3 text-base text-slate-900 outline-none placeholder:text-slate-400 focus:border-emerald-700 focus:ring-2 focus:ring-emerald-700/20 dark:border-emerald-800 dark:bg-slate-800 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-emerald-400 dark:focus:ring-emerald-400/30"
            />
          </div>

          <div>
            <label for="signup-email" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">
              Email address
            </label>
            <input
              id="signup-email"
              name="signup-email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
              class="block w-full rounded-lg border border-emerald-200 bg-white px-4 py-3 text-base text-slate-900 outline-none placeholder:text-slate-400 focus:border-emerald-700 focus:ring-2 focus:ring-emerald-700/20 dark:border-emerald-800 dark:bg-slate-800 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-emerald-400 dark:focus:ring-emerald-400/30"
            />
          </div>

          <div>
            <label for="signup-password" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">
              Password
            </label>
            <input
              id="signup-password"
              name="signup-password"
              type="password"
              autocomplete="new-password"
              required
              placeholder="Choose a password"
              class="block w-full rounded-lg border border-emerald-200 bg-white px-4 py-3 text-base text-slate-900 outline-none placeholder:text-slate-400 focus:border-emerald-700 focus:ring-2 focus:ring-emerald-700/20 dark:border-emerald-800 dark:bg-slate-800 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-emerald-400 dark:focus:ring-emerald-400/30"
            />
          </div>

          <button id="sign-up-button" type="submit" class="w-full rounded-lg bg-gradient-to-r from-emerald-700 via-teal-700 to-cyan-700 px-4 py-3 text-sm font-semibold text-white shadow-md shadow-emerald-900/20 transition hover:from-emerald-800 hover:via-teal-800 hover:to-cyan-800 focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60 dark:focus:ring-offset-slate-900">
            Create account
          </button>
          <p id="sign-up-status" class="min-h-5 text-sm text-slate-600 dark:text-slate-300" role="status" aria-live="polite"></p>
        </form>

        <div class="mt-6 border-t border-slate-200 pt-6 text-center text-sm dark:border-slate-700">
          <p class="text-slate-600 dark:text-slate-300">Need to bind your OneCard later?</p>
          <p class="mt-2 text-slate-500 dark:text-slate-400">
            The dashboard has a one-time OneCard setup section after you sign in.
          </p>
        </div>
      </section>
    </main>

    <script type="module">
      import {
        signInWithPassword,
        signUpWithPassword,
        getSessionMember,
      } from "./js/supabase.js";

      const signInForm = document.getElementById("sign-in-form");
      const signUpForm = document.getElementById("sign-up-form");
      const signInStatus = document.getElementById("sign-in-status");
      const signUpStatus = document.getElementById("sign-up-status");
      const signInButton = document.getElementById("sign-in-button");
      const signUpButton = document.getElementById("sign-up-button");
      const showSignInTab = document.getElementById("show-signin-tab");
      const showSignUpTab = document.getElementById("show-signup-tab");
      const themeToggle = document.getElementById("theme-toggle");

      function setThemeMode(isDark) {
        document.documentElement.classList.toggle("dark", isDark);
        try {
          localStorage.setItem("tapInTheme", isDark ? "dark" : "light");
        } catch (error) {
          console.error("Could not save the display theme preference.", error);
        }
        themeToggle.textContent = isDark ? "Switch to light mode" : "Switch to dark mode";
      }

      try {
        if (localStorage.getItem("tapInTheme") === "dark") {
          setThemeMode(true);
        }
      } catch (error) {
        console.error("Could not load the display theme preference.", error);
      }

      themeToggle.addEventListener("click", () => {
        const nextIsDark = !document.documentElement.classList.contains("dark");
        setThemeMode(nextIsDark);
      });

      function showTab(mode) {
        const isSignUp = mode === "signup";
        signInForm.classList.toggle("hidden", isSignUp);
        signUpForm.classList.toggle("hidden", !isSignUp);
        showSignInTab.classList.toggle("bg-white", !isSignUp);
        showSignInTab.classList.toggle("dark:bg-slate-900", !isSignUp);
        showSignInTab.classList.toggle("text-emerald-900", !isSignUp);
        showSignInTab.classList.toggle("dark:text-emerald-200", !isSignUp);
        showSignInTab.classList.toggle("text-slate-600", isSignUp);
        showSignInTab.classList.toggle("dark:text-slate-300", isSignUp);
        showSignUpTab.classList.toggle("bg-white", isSignUp);
        showSignUpTab.classList.toggle("dark:bg-slate-900", isSignUp);
        showSignUpTab.classList.toggle("text-emerald-900", isSignUp);
        showSignUpTab.classList.toggle("dark:text-emerald-200", isSignUp);
        showSignUpTab.classList.toggle("text-slate-600", !isSignUp);
        showSignUpTab.classList.toggle("dark:text-slate-300", !isSignUp);
      }

      function seedCosmeticProfile(member) {
        const fullName =
          typeof member?.full_name === "string" && member.full_name.trim()
            ? member.full_name.trim()
            : "Member";
        try {
          const existing = localStorage.getItem("tapInMemberProfile");
          if (existing) return;
          localStorage.setItem(
            "tapInMemberProfile",
            JSON.stringify({
              name: fullName,
              preferredName: fullName,
              picture: "",
            })
          );
        } catch (error) {
          console.error("Could not seed cosmetic profile settings.", error);
        }
      }

      showSignInTab.addEventListener("click", () => showTab("signin"));
      showSignUpTab.addEventListener("click", () => showTab("signup"));

      // Already signed in? Skip the gate.
      const { data: existingMember } = await getSessionMember();
      if (existingMember) {
        window.location.href = "dashboard.html";
      }

      signInForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        signInStatus.textContent = "Signing you in…";
        signInStatus.className = "min-h-5 text-sm text-slate-600 dark:text-slate-300";
        signInButton.disabled = true;

        const email = document.getElementById("signin-email").value.trim();
        const password = document.getElementById("signin-password").value;

        if (!email || !password) {
          signInStatus.textContent = "Please enter both your email and password.";
          signInStatus.className = "min-h-5 text-sm text-rose-700 dark:text-rose-300";
          signInButton.disabled = false;
          return;
        }

        const { data: member, error } = await signInWithPassword({ email, password });
        signInButton.disabled = false;

        if (error || !member) {
          const message = error?.message || "Sign in failed. Check your email and password.";
          signInStatus.textContent = message;
          signInStatus.className = "min-h-5 text-sm text-rose-700 dark:text-rose-300";
          if (/Invalid login credentials|Email not confirmed/i.test(message)) {
            // Stay on sign-in; confirm-email or bad password are Auth issues.
            return;
          }
          return;
        }

        seedCosmeticProfile(member);
        signInStatus.textContent = "Opening your dashboard…";
        signInStatus.className = "min-h-5 text-sm text-emerald-800 dark:text-emerald-300";
        window.location.href = "dashboard.html";
      });

      signUpForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        signUpStatus.textContent = "Creating your account…";
        signUpStatus.className = "min-h-5 text-sm text-slate-600 dark:text-slate-300";
        signUpButton.disabled = true;

        const fullName = document.getElementById("signup-name").value.trim();
        const email = document.getElementById("signup-email").value.trim();
        const password = document.getElementById("signup-password").value;

        if (!fullName || !email || !password) {
          signUpStatus.textContent = "Please fill in your full name, email, and password.";
          signUpStatus.className = "min-h-5 text-sm text-rose-700 dark:text-rose-300";
          signUpButton.disabled = false;
          return;
        }

        if (password.length < 6) {
          signUpStatus.textContent = "Password must be at least 6 characters.";
          signUpStatus.className = "min-h-5 text-sm text-rose-700 dark:text-rose-300";
          signUpButton.disabled = false;
          return;
        }

        const { data: member, error } = await signUpWithPassword({
          full_name: fullName,
          email,
          password,
        });
        signUpButton.disabled = false;

        // Hard failure — no members row created.
        if (error && !member) {
          signUpStatus.textContent = error.message || "Could not create your account.";
          signUpStatus.className = "min-h-5 text-sm text-rose-700 dark:text-rose-300";
          return;
        }

        seedCosmeticProfile(member);

        // Soft warning (e.g. confirm-email still on) — account exists; send them in.
        if (error && member) {
          signUpStatus.textContent = error.message;
          signUpStatus.className = "min-h-5 text-sm text-amber-800 dark:text-amber-300";
          window.setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1200);
          return;
        }

        signUpStatus.textContent = "Account created. Add your OneCard from the dashboard next.";
        signUpStatus.className = "min-h-5 text-sm text-emerald-800 dark:text-emerald-300";
        window.location.href = "dashboard.html";
      });
    </script>
  </body>
</html>
